name: Build Xbox UWP (experimental)

on:
  workflow_dispatch:
  push:
    branches: [xbox-one-s-uwp-v2.0.3]

permissions:
  contents: read

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  uwp:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Check out pinned UWP dependencies
        uses: actions/checkout@v6
        with:
          repository: SternXD/uwp-dep
          ref: 810cdcb672383045a8b03d1d55bb535352d7d46f
          path: build/uwp-dep

      # uwp-dep's SDL3 3.4.16 never sets SDL thread IDs with its stdcpp thread backend, which
      # deadlocks WASAPI on the first audio open. Rebuild that exact source with the fix.
      - name: Check out pinned SDL3-uwp source
        uses: actions/checkout@v6
        with:
          repository: SternXD/SDL3-uwp
          ref: ddd5d4f99a26ac95d4620ccf489c07fcf5f08636
          path: build/sdl3-uwp

      - name: Build patched SDL3
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'build/sdl3-uwp'
          git -C $src apply (Join-Path $env:GITHUB_WORKSPACE 'platforms/uwp/patches/sdl3-stdcpp-thread-id.patch')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          msbuild (Join-Path $src 'VisualC-WinRT/SDL-UWP.vcxproj') /m /p:Configuration=Release /p:Platform=x64 `
            /p:PlatformToolset=v143 /p:ApplicationTypeRevision=10.0 "/p:SolutionDir=$src/VisualC-WinRT/"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $dep = Join-Path $env:GITHUB_WORKSPACE 'build/uwp-dep/x64'
          foreach ($file in @(@('SDL3.dll', 'bin'), @('SDL3.lib', 'lib'))) {
            $built = @(Get-ChildItem (Join-Path $src 'VisualC-WinRT') -Recurse -Filter $file[0])
            if ($built.Count -ne 1) { throw "Expected one built $($file[0]), found $($built.Count)" }
            Copy-Item $built[0].FullName (Join-Path $dep $file[1]) -Force
          }

      - name: Assign a unique development package revision
        run: |
          $revision = [int]$env:GITHUB_RUN_NUMBER
          if ($revision -gt 65535) { throw "Package revision exceeds UWP limit" }
          $path = Join-Path $env:GITHUB_WORKSPACE "platforms/uwp/Package.appxmanifest"
          [xml]$manifest = Get-Content $path
          $manifest.Package.Identity.Version = "2.0.3.$revision"
          $manifest.Save($path)

      - name: Configure UWP application
        run: |
          cmake -S . -B build-uwp -G "Visual Studio 17 2022" -A x64 `
            -DDUSK_UWP=ON -DCMAKE_SYSTEM_NAME=WindowsStore -DCMAKE_SYSTEM_VERSION=10.0 `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
            -DAURORA_UWP_DEP_SOURCE_DIR="$env:GITHUB_WORKSPACE/build/uwp-dep"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Create development signing certificate
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=odolwa' `
            -KeyUsage DigitalSignature -FriendlyName 'Dusklight development' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')
          "UWP_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build signed sideload package
        run: |
          cmake --build build-uwp --config RelWithDebInfo --parallel 4 -- `
            /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint=$env:UWP_CERT_THUMBPRINT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem build-uwp -Recurse -Include *.appx,*.msix,*.appxbundle,*.msixbundle)
          if (!$packages.Count) { throw 'Build succeeded without an installable UWP package.' }
          $package = $packages | Where-Object { $_.Name -like 'dusklight_*.msix' } | Select-Object -First 1
          if (!$package) { throw 'Dusklight MSIX was not produced.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $entry = $zip.GetEntry('resources.pri')
            if (!$entry) { throw 'Package has no resource index.' }
            $pri = Join-Path $env:RUNNER_TEMP 'dusklight-resources.pri'
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $pri, $true)
          } finally { $zip.Dispose() }
          $dump = Join-Path $env:RUNNER_TEMP 'dusklight-resources.xml'
          makepri dump /if $pri /of $dump /o
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $index = Get-Content $dump -Raw
          foreach ($image in @('SplashScreen.png', 'Square150x150Logo.png', 'Square44x44Logo.png')) {
            if (!$index.Contains($image)) { throw "Resource index is missing $image" }
          }

      - name: Upload installable package
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-uwp-experimental-x64
          path: build-uwp/**/AppPackages/**
          if-no-files-found: error

      - name: Upload configure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: uwp-build-diagnostics
          path: |
            build/**/CMakeConfigureLog.yaml
            build-uwp/**/CMakeConfigureLog.yaml
