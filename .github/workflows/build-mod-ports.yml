name: Build Xbox native mod ports (experimental)

on:
  workflow_dispatch:
  push:
    branches: [xbox-mod-ports]

permissions:
  contents: read
  actions: read

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  interpolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Check interpolation storage and ownership
        run: |
          cmake -S tests/interp -B build-interp-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build-interp-tests --parallel 4 --target interpolation_storage_test
          ctest --test-dir build-interp-tests --output-on-failure

  uwp:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Check HUD regressions
        run: |
          cmake -S tests/ui-overlay -B build-overlay-tests -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-overlay-tests --config Release --parallel 4 --target overlay_test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build-overlay-tests -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Check native mod metadata retention
        run: |
          cmake -S sdk/tests/metadata -B build-metadata -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-metadata --config RelWithDebInfo --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build-metadata -C RelWithDebInfo --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/checkout@v6
        with:
          repository: 999sian/dawnlight
          ref: 55d5ca9645c576648bccbfa62f484efe539844c2
          path: mods/dawnlight

      - uses: actions/checkout@v6
        with:
          repository: 999sian/Roll-and-Sprint
          ref: b81bec1948ff734f4de086a1ebae54941561fac7
          path: mods/roll_and_sprint

      - uses: actions/checkout@v6
        with:
          repository: 999sian/TP-CM-Controller-UI
          ref: afb77cbf368b89eb7f2dc0b90b15a9cd417c6b24
          path: mods/tp_classic_ui

      - name: Check out pinned UWP dependencies
        uses: actions/checkout@v6
        with:
          repository: SternXD/uwp-dep
          ref: 810cdcb672383045a8b03d1d55bb535352d7d46f
          path: build/uwp-dep

      # uwp-dep's SDL3 3.4.16 never sets SDL thread IDs with its stdcpp thread backend, which
      # deadlocks WASAPI on the first audio open. Rebuild that exact source with the fix.
      - name: Check out pinned SDL3-uwp source
        uses: actions/checkout@v6
        with:
          repository: SternXD/SDL3-uwp
          ref: ddd5d4f99a26ac95d4620ccf489c07fcf5f08636
          path: build/sdl3-uwp

      - name: Build patched SDL3
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'build/sdl3-uwp'
          git -C $src apply (Join-Path $env:GITHUB_WORKSPACE 'platforms/uwp/patches/sdl3-stdcpp-thread-id.patch')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          msbuild (Join-Path $src 'VisualC-WinRT/SDL-UWP.vcxproj') /m /p:Configuration=Release /p:Platform=x64 `
            /p:PlatformToolset=v143 /p:ApplicationTypeRevision=10.0 "/p:SolutionDir=$src/VisualC-WinRT/"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $dep = Join-Path $env:GITHUB_WORKSPACE 'build/uwp-dep/x64'
          foreach ($file in @(@('SDL3.dll', 'bin'), @('SDL3.lib', 'lib'))) {
            $built = @(Get-ChildItem (Join-Path $src 'VisualC-WinRT') -Recurse -Filter $file[0])
            if ($built.Count -ne 1) { throw "Expected one built $($file[0]), found $($built.Count)" }
            Copy-Item $built[0].FullName (Join-Path $dep $file[1]) -Force
          }

      - name: Assign a unique development package revision
        run: |
          $revision = 1000 + [int]$env:GITHUB_RUN_NUMBER
          if ($revision -gt 65535) { throw "Package revision exceeds UWP limit" }
          $path = Join-Path $env:GITHUB_WORKSPACE "platforms/uwp/Package.appxmanifest"
          [xml]$manifest = Get-Content $path
          $manifest.Package.Identity.Version = "2.0.3.$revision"
          $manifest.Save($path)

      # Upstream ships this backend-neutral pipeline list with desktop builds; Aurora compiles
      # it in the background on first launch instead of stalling on first use.
      - name: Fetch pinned initial pipeline cache
        run: |
          $extra = Join-Path $env:GITHUB_WORKSPACE 'build/uwp-extra'
          New-Item -ItemType Directory -Force $extra | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'dusklight-win64.zip'
          gh release download v2.0.3 --repo TwilitRealm/dusklight -p 'Dusklight-v2.0.3-win32-x86_64.zip' -O $zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile(
              $archive.GetEntry('initial_pipeline_cache.db'), (Join-Path $extra 'initial_pipeline_cache.db'), $true)
          } finally { $archive.Dispose() }
          $hash = (Get-FileHash (Join-Path $extra 'initial_pipeline_cache.db') -Algorithm SHA256).Hash
          if ($hash -ne '8C6C7D974946B71AEE7FA90542085B333AF9E2726B16DCCB34F808F2C0C5C2F0') {
            throw "Unexpected initial pipeline cache hash $hash"
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure UWP application
        run: |
          cmake -S . -B build-uwp -G "Visual Studio 17 2022" -A x64 `
            -DDUSK_UWP=ON -DDUSK_XBOX_MOD_PORTS=ON -DCMAKE_SYSTEM_NAME=WindowsStore -DCMAKE_SYSTEM_VERSION=10.0 `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
            -DAURORA_UWP_DEP_SOURCE_DIR="$env:GITHUB_WORKSPACE/build/uwp-dep" `
            -DDUSK_UWP_EXTRA_CONTENT_DIR="$env:GITHUB_WORKSPACE/build/uwp-extra"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Reuse verified game binary and recover its import library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet 046149e09884b44989b64f3b1ee0fd96c8ffbc66 -- src include libs extern sdk platforms/uwp/main.cpp
          if ($LASTEXITCODE) { throw 'Host source changed; a full game build is required' }
          $sourceRun = gh api repos/$env:GITHUB_REPOSITORY/actions/runs/39708398636 | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($sourceRun.conclusion -ne 'success' -or $sourceRun.head_sha -ne 'f21cc53050e3fd50154e25dd45f2f11d95c9e993') {
            throw 'Unexpected base packaging run'
          }
          gh run download 39708398636 --repo $env:GITHUB_REPOSITORY -n dusklight-public-x64 -D base-package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem base-package -Recurse -Filter *.msix)
          if ($packages.Count -ne 1) { throw 'Expected one verified base package' }
          if ((Get-FileHash $packages[0].FullName).Hash -ne '8E3A128890FAC35E841536739D7C2332CDBA34906F01096DC7DFEBED9BA4A319') {
            throw 'Base MSIX hash mismatch'
          }
          $layout = Join-Path $env:RUNNER_TEMP 'mod-port-layout'
          makeappx unpack /p $packages[0].FullName /d $layout /o
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Join-Path $layout 'dusklight.exe'
          if ((Get-FileHash $exe).Hash -ne '325ED4ED0520BC4E82EA01D7222534C262F75B6E6B900C91C1DF2ADBD4DECDEF') {
            throw 'Base game hash mismatch'
          }
          $exports = @(& dumpbin /nologo /exports $exe)
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Preserve DATA exports so a missing dllimport annotation cannot link to a function thunk.
          $bytes = [IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $sectionCount = [BitConverter]::ToUInt16($bytes, $peOffset + 6)
          $sectionOffset = $peOffset + 24 + [BitConverter]::ToUInt16($bytes, $peOffset + 20)
          $sections = @(for ($i = 0; $i -lt $sectionCount; $i++) {
            $offset = $sectionOffset + 40 * $i
            @{rva=[BitConverter]::ToUInt32($bytes, $offset + 12);
              size=[Math]::Max([BitConverter]::ToUInt32($bytes, $offset + 8), [BitConverter]::ToUInt32($bytes, $offset + 16));
              executable=([BitConverter]::ToUInt32($bytes, $offset + 36) -band 0x20000000) -ne 0}
          })
          $symbols = @($exports | ForEach-Object {
            if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+([0-9A-F]{8})\s+(\S+)') {
              $rva = [Convert]::ToUInt32($Matches[1], 16)
              $name = $Matches[2]
              $section = @($sections | Where-Object { $rva -ge $_.rva -and $rva -lt ($_.rva + $_.size) })
              if ($section.Count -ne 1) { throw "Unmapped export $name" }
              if (!$section[0].executable) { "$name DATA" } else { $name }
            }
          } | Sort-Object -Unique)
          if ($symbols.Count -ne 30042) { throw "Unexpected export count $($symbols.Count)" }
          $definition = Join-Path $env:RUNNER_TEMP 'dusklight-base.def'
          @('LIBRARY dusklight.exe', 'EXPORTS') + $symbols | Set-Content $definition -Encoding ascii
          New-Item -ItemType Directory -Force build-uwp/RelWithDebInfo | Out-Null
          lib /nologo /def:$definition /machine:x64 /name:dusklight.exe /out:build-uwp/RelWithDebInfo/dusklight_imports.lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "PORT_LAYOUT=$layout" >> $env:GITHUB_ENV

      - name: Build bundled mod ports
        run: |
          cmake --build build-uwp --config RelWithDebInfo --parallel 4 `
            --target luau_runtime_package dawnlight_mod_package roll_and_sprint_package tp_classic_modern_controller_ui_package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $mods = Join-Path $env:GITHUB_WORKSPACE 'build/uwp-extra/mods'
          New-Item -ItemType Directory -Force $mods | Out-Null
          $bundles = @(Get-ChildItem build-uwp/bundled_mods -Filter *.dusk)
          if ($bundles.Count -ne 4) { throw "Expected four native mods, found $($bundles.Count)" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($bundle in $bundles) {
            $stage = Join-Path $env:RUNNER_TEMP $bundle.BaseName
            Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
            [System.IO.Compression.ZipFile]::ExtractToDirectory($bundle.FullName, $stage)
            $id = (Get-Content (Join-Path $stage 'mod.json') -Raw | ConvertFrom-Json).id
            if (!(Test-Path (Join-Path $stage 'lib/windows-amd64/mod.dll'))) { throw "$id has no windows-amd64 mod.dll" }
            switch ($id) {
              'dev.bezide.dawnlight' { Copy-Item mods/dawnlight/LICENSE.md (Join-Path $stage 'LICENSE.md') }
              'com.melonspeedruns.rollandsprint' { Copy-Item mods/roll_and_sprint/LICENSE (Join-Path $stage 'LICENSE') }
              'org.dusklight.tp_classic_buttons' { Copy-Item mods/tp_classic_ui/LICENSE (Join-Path $stage 'LICENSE') }
            }
            Move-Item $stage (Join-Path $mods $id)
          }
          cmake build-uwp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Create development signing certificate
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=odolwa' `
            -KeyUsage DigitalSignature -FriendlyName 'Dusklight development' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')
          "UWP_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Package ports with verified game and sign
        run: |
          $layout = $env:PORT_LAYOUT
          Copy-Item build/uwp-extra/mods/* (Join-Path $layout 'mods') -Recurse -Force
          [xml]$manifest = Get-Content (Join-Path $layout 'AppxManifest.xml')
          if ($manifest.Package.Identity.Name -ne 'Dusklight' -or $manifest.Package.Identity.Version -ne '2.0.3.54') {
            throw 'Unexpected base identity'
          }
          $version = "2.0.3.$(1000 + [int]$env:GITHUB_RUN_NUMBER)"
          $manifest.Package.Identity.Version = $version
          $manifest.Save((Join-Path $layout 'AppxManifest.xml'))
          foreach ($stale in @('AppxSignature.p7x', 'AppxBlockMap.xml', 'AppxMetadata/CodeIntegrity.cat')) {
            Remove-Item (Join-Path $layout $stale) -Force -ErrorAction SilentlyContinue
          }
          if ((Get-FileHash (Join-Path $layout 'dusklight.exe')).Hash -ne '325ED4ED0520BC4E82EA01D7222534C262F75B6E6B900C91C1DF2ADBD4DECDEF') {
            throw 'Game executable changed'
          }
          New-Item -ItemType Directory -Force port-package | Out-Null
          $msix = Join-Path $env:GITHUB_WORKSPACE "port-package/Dusklight_${version}_x64.msix"
          makeappx pack /d $layout /p $msix /o
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          signtool sign /fd SHA256 /sha1 $env:UWP_CERT_THUMBPRINT $msix
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Export-Certificate -Cert (Get-Item "Cert:\CurrentUser\My\$env:UWP_CERT_THUMBPRINT") -FilePath "port-package/Dusklight_${version}_x64.cer" | Out-Null
          $base = @(Get-ChildItem base-package -Recurse -Filter *.msix)[0]
          Copy-Item (Join-Path $base.DirectoryName 'Dependencies') port-package -Recurse
          @{base_run=39708398636; game_source='046149e09884b44989b64f3b1ee0fd96c8ffbc66';
            game_sha256=(Get-FileHash (Join-Path $layout 'dusklight.exe')).Hash;
            mod_build_source=$env:GITHUB_SHA; package_sha256=(Get-FileHash $msix).Hash} |
            ConvertTo-Json | Set-Content port-package/packaging-provenance.json
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix)
          try { $names = @($zip.Entries | ForEach-Object FullName) } finally { $zip.Dispose() }
          foreach ($required in @('dusklight.exe', 'initial_pipeline_cache.db',
              'res/licenses/Dusklight-CC0.txt', 'res/licenses/Font-notices.txt',
              'mods/dev.twilitrealm.luau/lib/windows-amd64/mod.dll',
              'mods/dev.bezide.dawnlight/lib/windows-amd64/mod.dll',
              'mods/com.melonspeedruns.rollandsprint/lib/windows-amd64/mod.dll',
              'mods/org.dusklight.tp_classic_buttons/lib/windows-amd64/mod.dll')) {
            if ($names -notcontains $required) { throw "Package is missing $required" }
          }
          if (@($names | Where-Object { $_ -like 'mods/*/lib/windows-amd64/mod.dll' }).Count -ne 4) {
            throw 'Experimental package must contain exactly four native libraries'
          }
          $allowedArt = @{}
          foreach ($folder in @('dev.bezide.dawnlight', 'org.dusklight.tp_classic_buttons')) {
            $root = Join-Path $env:GITHUB_WORKSPACE "build/uwp-extra/mods/$folder/res"
            Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -in @('.bti', '.bmd') } | ForEach-Object {
              $relative = [IO.Path]::GetRelativePath((Join-Path $env:GITHUB_WORKSPACE 'build/uwp-extra'), $_.FullName).Replace('\', '/')
              $allowedArt[$relative] = $true
            }
          }
          $forbidden = @($names | Where-Object {
            ($_ -match '(?i)\.(iso|gcm|rvz|wbfs|wia|gcz|ciso|wad|dol|rel|gci|raw|bti|bmd|brres|szs|arc|pfx|p12|key)$' -and !$allowedArt.ContainsKey($_)) -or
            $_ -like 'mods/dev.twilitrealm.randomizer/*' -or
            $_ -like 'mods/dev.twilitrealm.cosmetics/*' -or $_ -eq 'res/prelaunch-bg.png'
          })
          if ($forbidden.Count) {
            throw "Package contains excluded game/private resources: $($forbidden -join ', ')"
          }

      - name: Upload installable package
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-native-mod-ports-experimental-x64
          path: port-package/**
          if-no-files-found: error

      - name: Upload configure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: uwp-build-diagnostics
          path: |
            build/**/CMakeConfigureLog.yaml
            build-uwp/**/CMakeConfigureLog.yaml
