plugins {
    id 'com.android.application'
}

def duskRepoDir = rootProject.projectDir.parentFile.parentFile
def borealisDir = new File(duskRepoDir, 'extern/borealis')

ext.borealisAndroid = [
    borealisDir: borealisDir,
    propertiesFile: new File(duskRepoDir, 'build/android-arm64/borealis-android.properties'),
    namespace: 'com.joeyaw.tpvr',
    applicationId: 'com.joeyaw.tpvr',
    abis: ['arm64-v8a'],
    assets: [
        [
            from: new File(duskRepoDir, 'res'),
            into: 'res',
            excludes: ['**/.DS_Store']
        ],
        [
            from: new File(duskRepoDir, 'build/android-arm64/bundled_mods'),
            into: 'mods',
            includes: ['*.dusk']
        ]
    ],
    proguardRules: file('proguard-rules.pro')
]

apply from: new File(borealisDir, 'platforms/android/gradle/borealis-application.gradle')


// Upstream 2.0 replaced the old shell-script JNI staging (stage-jni-
// libs.sh) with borealis-application.gradle's own stageBorealisJniLibs
// task above, which only knows about libmain.so/libc++_shared.so --
// nothing about our VR mod's extra libopenxr_loader.so dependency.
// dusklight-android.properties is OUR OWN file (see CMakeLists.txt's VR/
// OpenXR fragment, "Dusklight VR: Android OpenXR loader staging
// properties"), independent of borealis's, so this stays a no-op if VR
// wasn't configured (e.g. DUSK_VR=OFF) rather than failing the build.
def dusklightPropertiesFile = new File(duskRepoDir, 'build/android-arm64/dusklight-android.properties')
if (dusklightPropertiesFile.isFile()) {
    def dusklightProperties = new Properties()
    dusklightPropertiesFile.withInputStream { dusklightProperties.load(it) }
    def openxrLoaderPath = dusklightProperties.getProperty('dusklight.openxrLoader')
    def openxrLoaderAbi = dusklightProperties.getProperty('dusklight.androidAbi')
    if (openxrLoaderPath && openxrLoaderAbi) {
        def openxrLoaderFile = file(openxrLoaderPath)
        def stagedOpenxrDir = layout.buildDirectory.dir('generated/jniLibs/dusklight')
        def stageOpenxrLoader = tasks.register('stageDusklightOpenxrLoader', Sync) {
            from(openxrLoaderFile) {
                rename { 'libopenxr_loader.so' }
                into openxrLoaderAbi
            }
            into(stagedOpenxrDir)
            doFirst {
                if (!openxrLoaderFile.isFile()) {
                    throw new GradleException(
                        "OpenXR loader library is missing: ${openxrLoaderFile}. Build the CMake VR target first.")
                }
            }
        }
        android.sourceSets.main.jniLibs.srcDirs += [stagedOpenxrDir]
        tasks.named('preBuild').configure { dependsOn(stageOpenxrLoader) }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

// Stable APK signing. Android refuses to install an update signed with a different key than the
// installed app, so without a fixed key every update turned into an uninstall + reinstall that
// wiped the app's internal storage (saves included). The key comes from Gradle properties (e.g.
// ~/.gradle/gradle.properties) or environment variables (CI), and is applied to debug builds too
// so local and CI builds can update each other in place. Without it, release stays unsigned and
// debug uses the machine's debug keystore, as before.
def signingValue = { String name -> findProperty(name) ?: System.getenv(name) }
def releaseKeystore = signingValue('DUSK_ANDROID_KEYSTORE')
if (releaseKeystore) {
    android {
        signingConfigs {
            dusklight {
                storeFile = file(releaseKeystore)
                storePassword = signingValue('DUSK_ANDROID_KEYSTORE_PASSWORD')
                keyAlias = signingValue('DUSK_ANDROID_KEY_ALIAS')
                keyPassword = signingValue('DUSK_ANDROID_KEY_PASSWORD') ?: signingValue('DUSK_ANDROID_KEYSTORE_PASSWORD')
            }
        }
        buildTypes {
            debug { signingConfig = signingConfigs.dusklight }
            release { signingConfig = signingConfigs.dusklight }
        }
    }
}
